server.port=${PORT:8081}
voyan.sqlite-path=${SQLITE_PATH:./.sqlite-data/voyan.sqlite}
voyan.firebase-config=${FIREBASE_CONFIG:./firebase-applet-config.json}
voyan.allowed-origin-patterns=${VOYAN_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,https://localhost,capacitor://localhost,ionic://localhost,https://*.onrender.com}
voyan.files-path=${FILES_PATH:./.file-data}
voyan.firebase-service-account=${FIREBASE_SERVICE_ACCOUNT_JSON:}
voyan.firebase-api-key=${FIREBASE_API_KEY:${VITE_FIREBASE_API_KEY:}}
voyan.gemini-api-key=${GEMINI_API_KEY:}
voyan.smtp-host=${SMTP_HOST:}
voyan.smtp-port=${SMTP_PORT:465}
voyan.smtp-user=${SMTP_USER:}
voyan.smtp-pass=${SMTP_PASS:}
voyan.mail-from=${MAIL_FROM:}
voyan.public-base-url=${PUBLIC_APP_URL:${PUBLIC_BASE_URL:${APP_URL:}}}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.error.include-message=never