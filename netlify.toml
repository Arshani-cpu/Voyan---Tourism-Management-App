[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA redirect – all paths → index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# API proxy to Render backend (optional – avoids CORS issues)
# Uncomment after you set VITE_JAVA_API_URL to your Render URL
# [[redirects]]
#   from   = "/api/*"
#   to     = "https://YOUR-APP.onrender.com/api/:splat"
#   status = 200
#   force  = true
